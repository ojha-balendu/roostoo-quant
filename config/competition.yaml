# HK vs AU vs IN Quant Trading Hackathon 2026: the configuration that trades.
# Use it with:   QUANTBOT_CONFIG=config/competition.yaml   (in .env)  or  quantbot --config config/competition.yaml ...
# Evaluate it:   python research/18_momentum_v2.py  (variant C)   and   python research/24_combined_portfolio.py
#
# Strategy: momentum sleeve (research/18 variant C). Every day at 00:00 UTC: rank all liquid coins by their
# 16-day momentum after removing BTC's influence, divided by their own volatility; long the 5 strongest and
# short the 5 weakest (equal weight), hedge the remaining BTC exposure with BTC, 95% gross. A held coin stays
# until it drops out of the top (bottom) 10, which keeps fees low.

exchange:
  base_url: https://mock-api.roostoo.com
  timeout_seconds: 10
  max_retries: 3
  min_request_interval_seconds: 0.5

fees:
  taker: 0.001
  maker: 0.0005
  short_open: 0.001
  short_close: 0.001

execution:
  long_order_mode: market
  limit_timeout_seconds: 60
  min_trade_usd: 100
  min_close_usd: 5
  rebalance_threshold: 0.005         # ignore weight changes below 0.5% of equity (same as the backtest)
  cash_buffer: 0.005
  pause_between_orders_seconds: 61   # at most one order per minute

risk:
  max_gross_leverage: 1.0            # the strategy already caps gross exposure at 0.95
  max_weight_per_asset: 0.25         # each coin is ~9% of equity; the BTC hedge stays well below this
  max_drawdown_kill: 0.15            # flatten if equity falls 15% below its peak...
  kill_cooldown_hours: 24            # ...and resume automatically a day later

live:
  dry_run: true                      # switch to false (or run with --no-dry-run) when the trading round starts
  poll_seconds: 10
  bar_interval: 1h
  rebalance_utc_hours: [0]           # once a day, on the bar closing at 00:00 UTC (as in the backtest)
  warmup_bars: 1200                  # 50 days of hourly history (30-day liquidity filter + 16-day momentum)
  warmup_source: binance
  db_path: state/bot.sqlite
  record_ticks: true
  heartbeat_minutes: 15
  log_dir: logs

accounting:
  short_collateral_in_usd_balance: true   # verified with `quantbot smoke-test --trade`

strategy:
  name: momentum_sleeve
  params:
    k: 5                             # coins long and coins short
    buffer_k: 10                     # keep a held coin until it falls outside the top / bottom 10
    lookbacks_days: [16]
    residual_riskadj: true           # rank by BTC-removed momentum divided by volatility
    weighting: equal
    gross: 0.95
    min_usd_per_hour: 200000         # liquidity filter (median hourly USD volume, last 30 days, from Binance)
    min_history_hours: 720
    rebalance_utc_hour: 0

data:
  raw_dir: data/raw
  processed_dir: data/processed
  universe_path: config/universe.yaml
  market: spot
  interval: 1h
  start: "2023-01-01"
  end: null
  max_workers: 8
  verify_checksum: true
  symbol_overrides: {}

backtest:
  initial_capital: 1000000
  long_fee: taker
  spread_bps: 2.0
  execution_delay_bars: 0
  report_dir: reports
