[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantbot"
version = "0.1.0"
description = "Autonomous trading infrastructure for the Roostoo quant competition"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "websocket-client>=1.7",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
research = ["jupyterlab", "matplotlib", "scipy", "statsmodels"]
rl = ["gymnasium>=0.29", "stable-baselines3>=2.3", "torch>=2.1", "matplotlib"]

[project.scripts]
quantbot = "quantbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/quantbot/analysis/indicators.py" = ["E741"]  # h, l, c = high, low, close (standard OHLC notation)
"tests/test_indicators.py" = ["E741"]
